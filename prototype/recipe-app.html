<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 레시피 노트</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#F3F7F0}
:root{--max-w:1200px;--bg:#F3F7F0;--white:#FFFFFF;--border:#D0E2C8;--border-sub:#E4EEE0;--text:#1A2816;--sub:#789068;--muted:#A8C898;--accent:#6A9A50;--accent-dark:#4A7830;--pad:24px}
@media(max-width:600px){:root{--pad:16px}}
.app{font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);display:flex;flex-direction:column}
.screen{display:none}.screen.on{display:flex;flex-direction:column;flex:1}
.auth-outer{flex:1;display:flex;align-items:center;justify-content:center;padding:40px var(--pad);background:var(--bg)}
.auth-card{background:var(--white);border-radius:24px;border:1px solid var(--border);padding:40px 36px;width:100%;max-width:400px}
@media(max-width:480px){.auth-card{padding:28px 20px;border-radius:16px}}
.auth-logo{text-align:center;margin-bottom:26px}
.auth-logo .em{font-size:34px;display:block;margin-bottom:8px}
.auth-logo h1{font-family:'Lora',serif;font-size:20px;color:var(--text);font-weight:600}
.auth-logo p{font-size:13px;color:var(--sub);margin-top:3px}
.auth-tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:22px;gap:4px}
.auth-tab{flex:1;padding:8px;border:none;border-radius:9px;font-family:'Noto Sans KR',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;background:transparent;color:var(--sub)}
.auth-tab.on{background:var(--white);color:var(--text);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.af{margin-bottom:13px}
.af label{font-size:10px;font-weight:500;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:5px}
.af input{width:100%;font-family:'Noto Sans KR',sans-serif;font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);outline:none;transition:border-color .15s}
.af input:focus{border-color:var(--accent);background:var(--white)}
.af input.err{border-color:#C94040}.af input.ok{border-color:var(--accent)}
.fmsg{font-size:11px;margin-top:4px;min-height:16px;display:flex;align-items:center;gap:4px}
.fmsg.err{color:#C94040}.fmsg.ok{color:var(--accent)}
.fmsg svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.auth-btn{width:100%;background:var(--accent);color:white;border:none;border-radius:10px;padding:12px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-top:6px;transition:background .15s}
.auth-btn:hover{background:var(--accent-dark)}.auth-btn:disabled{background:var(--muted);cursor:default}
.gerr{font-size:12px;color:#C94040;margin-top:10px;text-align:center;background:#FFF0F0;border-radius:8px;padding:6px 10px;display:none}.gerr.on{display:block}
.gok{font-size:12px;color:#386830;margin-top:10px;text-align:center;background:#EAF5E0;border-radius:8px;padding:6px 10px;display:none}.gok.on{display:block}
.pw-bars{display:flex;gap:3px;margin:5px 0 3px}
.pw-bar{flex:1;height:3px;border-radius:2px;background:var(--border-sub);transition:background .2s}
.pw-bar.weak{background:#C94040}.pw-bar.mid{background:#D4820A}.pw-bar.strong{background:var(--accent)}
.pw-lbl{font-size:11px;color:var(--muted)}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0}
.divider-line{flex:1;height:1px;background:var(--border-sub)}
.divider-txt{font-size:11px;color:var(--muted);white-space:nowrap}
.soc-hint{font-size:12px;color:var(--muted);text-align:center}
.home-outer{flex:1;background:var(--bg);padding:0 var(--pad) var(--pad)}
.home-inner{max-width:var(--max-w);margin:0 auto}
.home-top{padding:28px 0 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.home-top h2{font-family:'Lora',serif;font-size:24px;color:var(--text);font-weight:600}
.home-top p{font-size:13px;color:var(--sub);margin-top:3px}
@media(max-width:600px){.home-top h2{font-size:20px}}
.logout-btn{font-size:12px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:20px;padding:6px 14px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap;flex-shrink:0}
.logout-btn:hover{color:var(--sub);border-color:var(--muted)}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.cat-grid{grid-template-columns:1fr}}
.cat-card{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:22px 20px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:border-color .15s,box-shadow .15s,transform .15s}
.cat-card:hover{border-color:var(--muted);box-shadow:0 4px 20px rgba(106,154,80,.12);transform:translateY(-2px)}
@media(max-width:500px){.cat-card{padding:16px 14px;gap:12px}}
.cat-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
@media(max-width:500px){.cat-icon{width:42px;height:42px;font-size:22px;border-radius:10px}}
.ci-baking{background:#EAF5E0}.ci-food{background:#FEF5EF}.ci-drink{background:#EEF3FF}
.cat-info{flex:1;min-width:0}
.cat-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:2px}
.cat-desc{font-size:12px;color:var(--sub)}
.cat-cnt{font-size:11px;color:var(--muted);margin-top:3px}
.cat-arr svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sec-outer{flex:1;display:flex;flex-direction:column;background:var(--white)}
.sec-tabbar{background:var(--white);border-bottom:1px solid var(--border)}
.sec-tabbar-inner{max-width:var(--max-w);margin:0 auto;padding:0 var(--pad);display:flex;align-items:center}
.sec-back{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);transition:all .15s;flex-shrink:0;margin-right:8px}
.sec-back:hover{border-color:var(--muted);color:var(--text)}
.sec-back svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stab{font-family:'Noto Sans KR',sans-serif;padding:14px 16px 13px;font-size:13px;font-weight:400;color:var(--sub);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;transition:color .15s;white-space:nowrap;margin-bottom:-1px}
.stab svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stab.on{color:var(--text);font-weight:500;border-bottom-color:var(--accent)}
.stab:hover:not(.on){color:var(--text)}
@media(max-width:480px){.stab{padding:12px 10px 11px;font-size:12px}}
.sec-content{flex:1;background:var(--bg)}
.sec-body{max-width:var(--max-w);margin:0 auto;padding:24px var(--pad)}
@media(max-width:600px){.sec-body{padding:16px var(--pad)}}
.pg-title{font-family:'Lora',serif;font-size:22px;color:var(--text);font-weight:600;margin-bottom:2px}
.pg-sub{font-size:13px;color:var(--sub);margin-bottom:18px}
@media(max-width:600px){.pg-title{font-size:18px}}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.sc{background:var(--white);border-radius:14px;border:1px solid var(--border);padding:14px 16px}
.sl{font-size:10px;font-weight:500;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.sv{font-family:'Lora',serif;font-size:26px;color:var(--text);line-height:1;font-weight:600}
@media(max-width:400px){.sv{font-size:20px}}
.sechd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.seclabel{font-size:10px;font-weight:500;color:var(--sub);letter-spacing:.08em;text-transform:uppercase}
.rlist{background:var(--white);border-radius:14px;border:1px solid var(--border);overflow:hidden;margin-bottom:16px}
.ri{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border-sub);cursor:pointer;transition:background .12s}
.ri:last-child{border-bottom:none}.ri:hover{background:var(--bg)}
.remoji{font-size:19px;width:32px;height:32px;background:var(--bg);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rname{font-size:13px;color:var(--text);font-weight:500}
.rmeta{font-size:11px;color:var(--muted);margin-top:1px}
.tbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tbar input{flex:1;min-width:140px;font-family:'Noto Sans KR',sans-serif;font-size:13px;background:var(--white);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--text);outline:none}
.tbar input:focus{border-color:var(--accent)}
.tbar select{font-family:'Noto Sans KR',sans-serif;font-size:13px;background:var(--white);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--text);outline:none;cursor:pointer}
.frow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.ftag{font-size:12px;padding:4px 11px;border-radius:20px;cursor:pointer;border:1px solid var(--border);color:var(--sub);background:var(--white);transition:all .15s;font-family:'Noto Sans KR',sans-serif}
.ftag.on{background:var(--accent);color:white;border-color:var(--accent)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
@media(max-width:500px){.rgrid{grid-template-columns:repeat(2,1fr)}}
.rcard{background:var(--white);border:1px solid var(--border);border-radius:13px;padding:14px;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s}
.rcard:hover{border-color:var(--muted);box-shadow:0 2px 10px rgba(106,154,80,.1)}
.rcard .em{font-size:24px;margin-bottom:7px}
.rcard .nm{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px;line-height:1.4}
.rcard .mt{font-size:11px;color:var(--muted)}
.rcard .acts{position:absolute;top:8px;right:8px;display:none;gap:3px}
.rcard:hover .acts{display:flex}
.addcard{border:1.5px dashed #C0D8B0!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12px;min-height:100px;cursor:pointer;background:transparent!important;box-shadow:none!important}
.addcard:hover{border-color:var(--accent)!important;color:var(--accent)!important;background:#EAF5E0!important}
.rpill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;background:#E8F5E0;color:var(--accent);border:1px solid #B8D8A8;margin-top:5px}
.ibt{background:var(--white);border:1px solid var(--border);border-radius:6px;width:25px;height:25px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);transition:all .15s}
.ibt svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibt:hover{border-color:var(--muted);color:var(--text)}
.ibt.del:hover{color:#C94040;border-color:#F0B0B0;background:#FDEAEA}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
@media(max-width:500px){.igrid{grid-template-columns:repeat(2,1fr)}}
.iitem{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px;position:relative;transition:border-color .15s}
.iitem:hover{border-color:var(--muted)}
.inm{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.iqt{font-size:11px;color:var(--muted)}
.icpill{font-size:10px;padding:2px 7px;border-radius:20px;background:#E8F5E0;color:#407830;margin-top:5px;display:inline-block;border:1px solid #B8D8A8}
.lowbadge{font-size:10px;padding:2px 7px;border-radius:20px;background:#FDEAEA;color:#C94040;margin-top:5px;display:inline-block;margin-left:3px;border:1px solid #F0B0B0}
.iacts{position:absolute;top:6px;right:6px;display:none;gap:3px}
.iitem:hover .iacts{display:flex}
.fab{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:20px;background:var(--accent);color:white;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;transition:background .15s;white-space:nowrap}
.fab:hover{background:var(--accent-dark)}
.fab svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.empty{text-align:center;padding:28px;color:var(--muted);font-size:13px}
.ovl{display:none;position:fixed;inset:0;background:rgba(26,40,22,0.45);z-index:50;align-items:flex-start;justify-content:center;padding:14px var(--pad);overflow-y:auto}
.ovl.open{display:flex}
.modal{background:var(--white);border-radius:20px;border:1px solid var(--border);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;margin:auto}
@media(max-width:500px){.modal{border-radius:16px}}
.mhd{padding:18px 22px 14px;border-bottom:1px solid var(--border-sub)}
@media(max-width:500px){.mhd{padding:16px 16px 12px}}
.mhd h2{font-family:'Lora',serif;font-size:19px;color:var(--text);font-weight:600}
.mbody{padding:18px 22px}
@media(max-width:500px){.mbody{padding:14px 16px}}
.fr{margin-bottom:12px}
.fr label,.flbl{font-size:10px;font-weight:500;color:var(--sub);letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:5px}
.finput{width:100%;font-family:'Noto Sans KR',sans-serif;font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);outline:none;transition:border-color .15s}
.finput:focus{border-color:var(--accent);background:var(--white)}
.fselect{width:100%;font-family:'Noto Sans KR',sans-serif;font-size:13px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);outline:none;cursor:pointer}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
@media(max-width:420px){.row2{flex-direction:column;gap:0}}
.ovcols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:420px){.ovcols{grid-template-columns:1fr}}
.dynlist{display:flex;flex-direction:column;gap:7px;margin-bottom:5px}
.dynrow{display:flex;gap:7px;align-items:flex-start}
.dyninner{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.memoinput{width:100%;font-family:'Noto Sans KR',sans-serif;font-size:12px;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:#EAF5E0;color:#386830;resize:none;height:42px;outline:none}
.memoinput::placeholder{color:var(--muted)}
.stepnum{font-size:11px;font-weight:500;color:var(--muted);min-width:14px;margin-top:10px;text-align:center}
.addpill{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-radius:20px;border:1.5px dashed #C0D8B0;background:transparent;cursor:pointer;font-size:12px;color:var(--sub);font-family:'Noto Sans KR',sans-serif;transition:all .15s;width:100%}
.addpill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.addpill:hover{border-color:var(--accent);color:var(--accent);background:#EAF5E0}
.mfoot{padding:14px 22px;border-top:1px solid var(--border-sub);display:flex;justify-content:flex-end;gap:8px}
@media(max-width:500px){.mfoot{padding:12px 16px}}
.bcnl{font-family:'Noto Sans KR',sans-serif;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--white);font-size:13px;color:var(--sub);cursor:pointer}
.bsave{font-family:'Noto Sans KR',sans-serif;background:var(--accent);color:white;border:none;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.bsave:hover{background:var(--accent-dark)}
.emrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.eo{font-size:18px;cursor:pointer;padding:5px;border-radius:7px;border:1.5px solid transparent;transition:all .15s}
.eo.sel{border-color:var(--accent);background:#EAF5E0}
.eo:hover:not(.sel){background:var(--bg)}
.dsec{margin-bottom:13px}
.dsec h3{font-size:10px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.stplist{list-style:none;counter-reset:s}
.stplist li{counter-increment:s;padding:8px 0 8px 27px;position:relative;border-bottom:1px solid var(--border-sub)}
.stplist li::before{content:counter(s);position:absolute;left:0;top:10px;width:18px;height:18px;background:var(--accent);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500}
.stptxt{font-size:13px;color:var(--text);line-height:1.6}
.stpmemo{font-size:12px;color:#386830;margin-top:4px;padding:5px 9px;background:#EAF5E0;border-radius:6px;border-left:2px solid var(--accent);line-height:1.5;display:flex;gap:5px;align-items:flex-start}
.ovchips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 10px}
.ovchip{background:var(--bg);border-radius:7px;padding:5px 11px;font-size:12px;color:var(--text);border:1px solid var(--border)}
.ovchip span{font-size:10px;color:var(--sub);display:block;margin-bottom:1px}
.notebox{background:#EAF5E0;border-radius:7px;padding:8px 12px;font-size:12px;color:#386830;border:1px solid #B8D8A8;display:flex;gap:6px;align-items:flex-start}
.stepper-row{display:flex;align-items:center;gap:7px}
.stepper{display:flex;align-items:center;background:var(--bg);border-radius:40px;border:1px solid var(--border);overflow:hidden}
.stp-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;color:var(--accent);font-size:16px;line-height:1;transition:background .12s;font-family:monospace}
.stp-btn:hover{background:#D8EED0}.stp-btn:disabled{color:#C8DCC0;cursor:default}
.stp-val{min-width:30px;text-align:center;font-size:13px;font-weight:500;color:var(--text)}
.stp-lbl{font-size:11px;color:var(--sub)}
.ing-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--border-sub)}
.ing-dot{color:var(--accent);font-size:14px;flex-shrink:0}
.ing-name{flex:1;font-size:13px;color:var(--text);min-width:60px}
.ing-nums{display:flex;align-items:center;gap:3px;flex-shrink:0}
.num-orig{font-size:11px;color:#B8D0A8;text-decoration:line-through;white-space:nowrap}
.num-arr{font-size:10px;color:var(--muted)}
.num-scaled{font-size:12px;font-weight:500;color:#2A5820;background:#C8E8B0;padding:1px 6px;border-radius:5px;border:1px solid #98CC78;white-space:nowrap}
.num-base{font-size:12px;color:#5A7A50;background:var(--bg);padding:1px 6px;border-radius:5px;border:1px solid var(--border);white-space:nowrap}
</style>
</head>

<svg style="display:none" aria-hidden="true"><defs>
  <symbol id="ic-ar" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
  <symbol id="ic-al" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>

  <symbol id="ic-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>

<script>
let USERS=[{id:'admin',pw:'1234',name:'관리자'},{id:'user1',pw:'pass1',name:'홍길동'}];
const SECTIONS={baking:{title:'베이킹노트',desc:'케이크, 쿠키, 빵, 머핀',icon:'🧁',cats:['케이크','쿠키','빵','파이/타르트','머핀','기타'],showOven:true},food:{title:'음식 레시피',desc:'한식, 중식, 일식, 양식',icon:'🍳',cats:['한식','중식','일식','양식','동남아','기타'],showOven:false},drink:{title:'음료 레시피',desc:'커피, 티, 스무디, 에이드',icon:'🥤',cats:['커피','티','스무디','에이드','주스','기타'],showOven:false}};
const EMOJIS={baking:['🍰','🎂','🍩','🍪','🥐','🧁','🍞','🥧','🫐','🍫','🥮','🍮'],food:['🍳','🥘','🍜','🍱','🥗','🍲','🥩','🍛','🍣','🥟','🫕','🍝'],drink:['☕','🍵','🧋','🥤','🍹','🧃','🍶','🫖','🥛','🍺','🧊','🍷']};
let D={baking:{recipes:[{id:1,emoji:'🧁',name:'바닐라 컵케이크',cat:'머핀',serving:'12개',preheat:175,bakeTemp:175,bakeTime:22,ingredients:['박력분 200g','설탕 150g','버터 115g','달걀 2개','우유 120ml'],steps:[{text:'오븐 175°C 예열.',memo:''},{text:'버터+설탕 크림화.',memo:'실온 버터 사용.'},{text:'달걀 하나씩 추가.',memo:''},{text:'가루류 체쳐 넣기.',memo:''},{text:'22분 굽기.',memo:'이쑤시개 테스트.'}],note:'생크림 프로스팅 추천.',createdAt:Date.now()-864e5*2},{id:2,emoji:'🍫',name:'퍼지 브라우니',cat:'케이크',serving:'16조각',preheat:180,bakeTemp:180,bakeTime:25,ingredients:['다크초콜릿 200g','버터 115g','설탕 200g','달걀 3개','박력분 100g'],steps:[{text:'오븐 180°C 예열.',memo:''},{text:'초콜릿+버터 중탕.',memo:'약불 사용.'},{text:'달걀 하나씩.',memo:''},{text:'가루 폴딩.',memo:''},{text:'25분 굽기.',memo:''}],note:'냉장 후 더 맛있어요.',createdAt:Date.now()-864e5}],pantry:[{id:1,name:'박력분',qty:'1kg',cat:'밀가루류',low:false},{id:2,name:'버터',qty:'200g',cat:'오일/버터',low:true},{id:3,name:'설탕',qty:'500g',cat:'당류',low:false},{id:4,name:'달걀',qty:'6개',cat:'달걀',low:false},{id:5,name:'베이킹파우더',qty:'50g',cat:'팽창제',low:true}]},food:{recipes:[{id:1,emoji:'🍳',name:'김치찌개',cat:'한식',serving:'2인분',preheat:null,bakeTemp:null,bakeTime:null,ingredients:['김치 300g','돼지고기 150g','두부 1/2모','대파 1대'],steps:[{text:'돼지고기 볶기.',memo:'기름 없이.'},{text:'김치 넣고 볶기.',memo:''},{text:'물 600ml 붓고 끓이기.',memo:''},{text:'두부, 대파 추가 후 5분.',memo:''}],note:'묵은지로 하면 더 깊어요.',createdAt:Date.now()-864e5}],pantry:[{id:1,name:'고춧가루',qty:'200g',cat:'양념/소스',low:false},{id:2,name:'된장',qty:'500g',cat:'양념/소스',low:false}]},drink:{recipes:[{id:1,emoji:'☕',name:'달고나 커피',cat:'커피',serving:'1잔',preheat:null,bakeTemp:null,bakeTime:null,ingredients:['인스턴트 커피 2tbsp','설탕 2tbsp','뜨거운 물 2tbsp','우유 200ml'],steps:[{text:'커피+설탕+물 400번 젓기.',memo:'전동 거품기 가능.'},{text:'우유를 잔에 붓기.',memo:''},{text:'위에 거품 올리기.',memo:''}],note:'얼음 추가하면 아이스.',createdAt:Date.now()-864e5}],pantry:[{id:1,name:'인스턴트 커피',qty:'100g',cat:'기타',low:true},{id:2,name:'우유',qty:'1L',cat:'유제품',low:false}]}};
let curUser=null,curSec='baking',curPage='dash',catF='전체',editRId=null,editIId=null,selE='',dM=1,dRId=null;
function ico(id){return`<svg style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><use href="#${id}"/></svg>`;}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById('sc-'+id).classList.add('on');}
function switchTab(t){document.getElementById('tab-login').classList.toggle('on',t==='login');document.getElementById('tab-signup').classList.toggle('on',t==='signup');document.getElementById('form-login').style.display=t==='login'?'block':'none';document.getElementById('form-signup').style.display=t==='signup'?'block':'none';document.getElementById('loginErr').classList.remove('on');}
function sfm(id,type,txt){const m=document.getElementById(id);m.className='fmsg'+(type?' '+type:'');m.innerHTML=type?`<svg style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><use href="#ic-${type==='ok'?'check':'x2'}"/></svg><span>${txt}</span>`:txt;}
function vName(){const v=document.getElementById('sName').value.trim();if(!v){sfm('msg-name','','');return false;}if(v.length<2){sfm('msg-name','err','2자 이상 입력해주세요');return false;}sfm('msg-name','ok','좋아요!');return true;}
function vId(){const v=document.getElementById('sId').value.trim();if(!v){sfm('msg-id','','');return false;}if(!/^[a-z0-9_]{4,20}$/.test(v)){sfm('msg-id','err','영문 소문자, 숫자, _ 4~20자');return false;}if(USERS.find(u=>u.id===v)){sfm('msg-id','err','이미 사용 중인 아이디예요');return false;}sfm('msg-id','ok','사용 가능한 아이디예요');return true;}
function gpwStr(pw){if(!pw)return 0;let s=0;if(pw.length>=8)s++;if(/[A-Z]/.test(pw)||/[a-z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;return s;}
function vPw(){const v=document.getElementById('sPw').value;const s=gpwStr(v);const cls=s<=1?'weak':s<=2?'mid':'strong';const lbl=['','취약','보통','강함','매우 강함'];['pb1','pb2','pb3','pb4'].forEach((b,i)=>{document.getElementById(b).className='pw-bar'+(i<s?' '+cls:'');});document.getElementById('pw-lbl').textContent=v?lbl[s]:'';if(document.getElementById('sPwC').value)vPwC();chkReady();return v.length>=8;}
function vPwC(){const pw=document.getElementById('sPw').value,pwc=document.getElementById('sPwC').value;if(!pwc){sfm('msg-pwc','','');return false;}if(pw!==pwc){sfm('msg-pwc','err','비밀번호가 일치하지 않아요');return false;}sfm('msg-pwc','ok','비밀번호가 일치해요');chkReady();return true;}
function chkReady(){const ok=vName()&&vId()&&document.getElementById('sPw').value.length>=8&&document.getElementById('sPw').value===document.getElementById('sPwC').value;document.getElementById('signupBtn').disabled=!ok;return ok;}
function tryLogin(){const id=document.getElementById('lId').value.trim(),pw=document.getElementById('lPw').value;const u=USERS.find(u=>u.id===id&&u.pw===pw);const e=document.getElementById('loginErr');if(!u){e.textContent='아이디 또는 비밀번호가 틀렸어요.';e.classList.add('on');return;}e.classList.remove('on');curUser=u;document.getElementById('lId').value='';document.getElementById('lPw').value='';goHome();}
function trySignup(){if(!chkReady())return;const name=document.getElementById('sName').value.trim(),id=document.getElementById('sId').value.trim(),pw=document.getElementById('sPw').value;USERS.push({id,pw,name});const ok=document.getElementById('signupOk');ok.textContent=`${name}님, 가입 완료! 로그인해주세요 🎉`;ok.classList.add('on');document.getElementById('signupBtn').disabled=true;setTimeout(()=>{ok.classList.remove('on');['sName','sId','sPw','sPwC'].forEach(i=>document.getElementById(i).value='');['pb1','pb2','pb3','pb4'].forEach(b=>document.getElementById(b).className='pw-bar');document.getElementById('pw-lbl').textContent='';['msg-name','msg-id','msg-pwc'].forEach(i=>sfm(i,'',''));switchTab('login');document.getElementById('lId').value=id;},2000);}
function logout(){curUser=null;show('auth');switchTab('login');}
function goHome(){show('home');if(curUser){document.getElementById('homeTitle').textContent=curUser.name+'의 레시피 노트';document.getElementById('homeGreet').textContent='오늘도 맛있게 구워봐요 🍵';}['baking','food','drink'].forEach(s=>{const el=document.getElementById('cnt-'+s);if(el)el.textContent='레시피 '+D[s].recipes.length+'개 · 재료 '+D[s].pantry.length+'종';});}
function goSection(sec){curSec=sec;curPage='dash';catF='전체';const cfg=SECTIONS[sec];document.getElementById('sIcon').textContent=cfg.icon;show('section');spg('dash');}
function spg(p){curPage=p;document.querySelectorAll('.stab').forEach(b=>b.classList.remove('on'));document.getElementById('sp-'+p).classList.add('on');if(p==='dash')rDash();if(p==='recipes')rR();if(p==='pantry')rI();}
function rDash(){const d=D[curSec];const low=d.pantry.filter(i=>i.low).length;const cfg=SECTIONS[curSec];const recent=[...d.recipes].sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);document.getElementById('sBody').innerHTML=`<div class="pg-title">${curUser?curUser.name+'의 ':''} ${cfg.title}</div><div class="pg-sub">${cfg.desc}</div><div class="sgrid"><div class="sc"><div class="sl">레시피</div><div class="sv">${d.recipes.length}</div></div><div class="sc"><div class="sl">재료 종류</div><div class="sv">${d.pantry.length}</div></div><div class="sc"><div class="sl">재고 부족</div><div class="sv" style="color:${low?'#C94040':'var(--text)'}">${low}</div></div></div><div class="sechd"><span class="seclabel">최근 레시피</span><button class="fab" onclick="openRM()"><svg style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round"><use href="#ic-plus"/></svg>레시피 추가</button></div><div class="rlist">${recent.length?recent.map(r=>`<div class="ri" onclick="showD(${r.id})"><div class="remoji">${r.emoji}</div><div style="flex:1;min-width:0"><div class="rname">${r.name}</div><div class="rmeta">${r.cat}${r.serving?' · '+r.serving:''}</div></div><svg style="width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><use href="#ic-ar"/></svg></div>`).join(''):'<div class="empty">아직 레시피가 없어요</div>'}</div>`;}
function rR(){const d=D[curSec];const allCats=['전체',...new Set(d.recipes.map(r=>r.cat))];document.getElementById('sBody').innerHTML=`<div class="tbar"><input type="text" id="rsearch" placeholder="레시피 검색..." oninput="fR(this.value)"></div><div class="frow">${allCats.map(c=>`<span class="ftag${catF===c?' on':''}" onclick="setC('${c}')">${c}</span>`).join('')}</div><div class="rgrid" id="rgrid"></div>`;rRGrid(d.recipes.filter(r=>catF==='전체'||r.cat===catF));}
function fR(q){rRGrid(D[curSec].recipes.filter(r=>(catF==='전체'||r.cat===catF)&&r.name.toLowerCase().includes(q.toLowerCase())));}
function rRGrid(list){const g=document.getElementById('rgrid');if(!g)return;g.innerHTML=list.map(r=>`<div class="rcard" onclick="showD(${r.id})"><div class="acts"><div class="ibt" onclick="event.stopPropagation();editR(${r.id})">${ico('ic-edit')}</div><div class="ibt del" onclick="event.stopPropagation();delR(${r.id})">${ico('ic-trash')}</div></div><div class="em">${r.emoji}</div><div class="nm">${r.name}</div><div class="mt">${r.serving}</div><span class="rpill">${r.cat}</span></div>`).join('')+`<div class="rcard addcard" onclick="openRM()"><svg style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round"><use href="#ic-plus"/></svg><span>새 레시피</span></div>`;}
function setC(c){catF=c;rR();}
function rI(){const d=D[curSec];document.getElementById('sBody').innerHTML=`<div class="tbar"><input type="text" id="isearch" placeholder="재료 검색..." oninput="fI(this.value)"><select id="icatf" onchange="rIG()" style="font-family:'Noto Sans KR',sans-serif;font-size:13px;background:white;border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--text);outline:none;cursor:pointer"><option value="전체">전체</option>${[...new Set(d.pantry.map(i=>i.cat))].map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div><div class="sechd" style="margin-bottom:10px"><span class="seclabel">총 ${d.pantry.length}종</span><button class="fab" onclick="openIM()"><svg style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round"><use href="#ic-plus"/></svg>추가</button></div><div class="igrid" id="igrid"></div>`;rIG();}
function fI(q){rIG(q);}
function rIG(q=''){const cf=(document.getElementById('icatf')||{value:'전체'}).value;const sq=q||(document.getElementById('isearch')||{value:''}).value;const list=D[curSec].pantry.filter(i=>(cf==='전체'||i.cat===cf)&&i.name.toLowerCase().includes(sq.toLowerCase()));const g=document.getElementById('igrid');if(!g)return;g.innerHTML=list.map(i=>`<div class="iitem"><div class="iacts"><div class="ibt" onclick="editI(${i.id})">${ico('ic-edit')}</div><div class="ibt del" onclick="delI(${i.id})">${ico('ic-trash')}</div></div><div class="inm">${i.name}</div><div class="iqt">${i.qty}</div><div><span class="icpill">${i.cat}</span>${i.low?'<span class="lowbadge">부족</span>':''}</div></div>`).join('');}
function pI(t){const p=[];const re=/(\d+\/\d+|\d+\.?\d*)/g;let l=0,m;while((m=re.exec(t))!==null){if(m.index>l)p.push({type:'text',val:t.slice(l,m.index)});p.push({type:'num',val:m[0]});l=m.index+m[0].length;}if(l<t.length)p.push({type:'text',val:t.slice(l)});return p;}
function sN(s,m){const n=s.includes('/')?s.split('/').reduce((a,b)=>a/b):parseFloat(s);const r=n*m;return Number.isInteger(r)?String(r):parseFloat(r.toFixed(2)).toString();}
function sT(t,m){return pI(t).map(p=>p.type==='num'?sN(p.val,m):p.val).join('');}
function iN(t){return pI(t).filter(p=>p.type==='text').map(p=>p.val).join('').trim()||t;}
function chM(d){dM=Math.max(1,dM+d);document.getElementById('stpVal').textContent=dM;document.getElementById('stpMinus').disabled=dM<=1;rIA();const r=D[curSec].recipes.find(x=>x.id===dRId);if(r){const el=document.getElementById('dServ');if(el)el.textContent=dM>1?sT(r.serving,dM):r.serving;}}
function rIA(){const r=D[curSec].recipes.find(x=>x.id===dRId);const a=document.getElementById('ingArea');if(!r||!a)return;a.innerHTML=(r.ingredients||[]).map(ing=>{const nm=iN(ing);const nums=dM===1?`<span class="num-base">${ing}</span>`:`<span class="num-orig">${ing}</span><span class="num-arr">→</span><span class="num-scaled">${sT(ing,dM)}</span>`;return`<div class="ing-row"><span class="ing-dot">·</span><span class="ing-name">${nm}</span><span class="ing-nums">${nums}</span></div>`;}).join('');}
function showD(id){const r=D[curSec].recipes.find(x=>x.id===id);dRId=id;dM=1;const cfg=SECTIONS[curSec];const ov=cfg.showOven&&(r.preheat||r.bakeTemp||r.bakeTime)?`<div class="dsec"><h3>오븐 설정</h3><div class="ovchips">${r.preheat?`<div class="ovchip"><span>예열</span>${r.preheat}°C</div>`:''}${r.bakeTemp?`<div class="ovchip"><span>굽는 온도</span>${r.bakeTemp}°C</div>`:''}${r.bakeTime?`<div class="ovchip"><span>굽는 시간</span>${r.bakeTime}분</div>`:''}</div></div>`:'';const mIco=`<svg style="width:11px;height:11px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px;flex-shrink:0"><use href="#ic-note"/></svg>`;const bIco=`<svg style="width:12px;height:12px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px"><use href="#ic-bulb"/></svg>`;document.getElementById('dtContent').innerHTML=`<div class="mhd"><div style="font-size:34px;margin-bottom:7px">${r.emoji}</div><h2 style="font-family:'Lora',serif;font-size:18px;color:var(--text);font-weight:600">${r.name}</h2><div style="font-size:12px;color:var(--sub);margin-top:3px">${r.cat} · <span id="dServ">${r.serving}</span></div></div><div class="mbody">${ov}${r.ingredients&&r.ingredients.length?`<div class="dsec"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px"><h3 style="margin:0">재료</h3><div class="stepper-row"><span class="stp-lbl">배수</span><div class="stepper"><button class="stp-btn" id="stpMinus" onclick="chM(-1)" disabled>−</button><span class="stp-val" id="stpVal">1</span><button class="stp-btn" onclick="chM(1)">+</button></div></div></div><div id="ingArea"></div></div>`:''}${r.steps&&r.steps.length?`<div class="dsec"><h3>만드는 방법</h3><ol class="stplist">${r.steps.map(s=>{const t=typeof s==='string'?s:s.text;const m=typeof s==='string'?'':s.memo;return`<li><div class="stptxt">${t}</div>${m?`<div class="stpmemo">${mIco}<span>${m}</span></div>`:''}</li>`;}).join('')}</ol></div>`:''}${r.note?`<div class="dsec"><div class="notebox">${bIco}<span>${r.note}</span></div></div>`:''}</div><div class="mfoot"><button class="bcnl" onclick="cm('dtModal')">닫기</button><button class="bsave" onclick="cm('dtModal');editR(${r.id})">수정하기</button></div>`;document.getElementById('dtModal').classList.add('open');rIA();}
function rEP(){const emojis=EMOJIS[curSec]||EMOJIS.baking;document.getElementById('emPicker').innerHTML=emojis.map(e=>`<span class="eo${e===selE?' sel':''}" onclick="sE2('${e}')">${e}</span>`).join('');}
function sE2(e){selE=e;rEP();}
function setCO(){const cats=SECTIONS[curSec].cats;document.getElementById('rCat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');document.getElementById('ovenWrap').style.display=SECTIONS[curSec].showOven?'block':'none';}
function toggleCC(){const v=document.getElementById('rCat').value;document.getElementById('ccWrap').style.display=v==='기타'?'block':'none';}
function openRM(){editRId=null;selE=EMOJIS[curSec][0];document.getElementById('rmTitle').textContent='새 레시피';['rName','rServ','rPre','rBT','rBM','rNote','rCatC'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});setCO();document.getElementById('ccWrap').style.display='none';document.getElementById('ingInputs').innerHTML='';document.getElementById('stepInputs').innerHTML='';addIng();addStep();rEP();document.getElementById('rmModal').classList.add('open');}
function editR(id){const r=D[curSec].recipes.find(x=>x.id===id);editRId=id;selE=r.emoji;document.getElementById('rmTitle').textContent='레시피 수정';document.getElementById('rName').value=r.name;document.getElementById('rServ').value=r.serving||'';setCO();const cats=SECTIONS[curSec].cats;if(!cats.includes(r.cat)){document.getElementById('rCat').value='기타';document.getElementById('rCatC').value=r.cat;document.getElementById('ccWrap').style.display='block';}else{document.getElementById('rCat').value=r.cat;document.getElementById('ccWrap').style.display='none';}if(SECTIONS[curSec].showOven){document.getElementById('rPre').value=r.preheat||'';document.getElementById('rBT').value=r.bakeTemp||'';document.getElementById('rBM').value=r.bakeTime||'';}document.getElementById('rNote').value=r.note||'';document.getElementById('ingInputs').innerHTML='';(r.ingredients||[]).forEach(v=>addIng(v));document.getElementById('stepInputs').innerHTML='';(r.steps||[]).forEach(s=>addStep(typeof s==='string'?s:s.text,typeof s==='string'?'':s.memo||''));rEP();document.getElementById('rmModal').classList.add('open');}
function saveR(){const name=document.getElementById('rName').value.trim();if(!name)return;const cs=document.getElementById('rCat').value;const cat=cs==='기타'?(document.getElementById('rCatC').value.trim()||'기타'):cs;const ingredients=[...document.querySelectorAll('#ingInputs .dynrow input')].map(i=>i.value.trim()).filter(Boolean);const steps=[...document.querySelectorAll('#stepInputs .dynrow')].map(r=>({text:(r.querySelector('input[type=text]')||{value:''}).value.trim(),memo:(r.querySelector('textarea')||{value:''}).value.trim()})).filter(s=>s.text);const cfg=SECTIONS[curSec];const d={emoji:selE,name,cat,serving:document.getElementById('rServ').value||'',preheat:cfg.showOven?parseInt(document.getElementById('rPre').value)||null:null,bakeTemp:cfg.showOven?parseInt(document.getElementById('rBT').value)||null:null,bakeTime:cfg.showOven?parseInt(document.getElementById('rBM').value)||null:null,ingredients,steps,note:document.getElementById('rNote').value.trim()};if(editRId){const i=D[curSec].recipes.findIndex(x=>x.id===editRId);D[curSec].recipes[i]={...D[curSec].recipes[i],...d};}else D[curSec].recipes.unshift({id:Date.now(),createdAt:Date.now(),...d});cm('rmModal');if(curPage==='recipes')rR();else rDash();}
function delR(id){if(confirm('삭제할까요?')){D[curSec].recipes=D[curSec].recipes.filter(r=>r.id!==id);if(curPage==='recipes')rR();else rDash();}}
function addIng(v=''){const d=document.getElementById('ingInputs');const row=document.createElement('div');row.className='dynrow';row.innerHTML=`<input class="finput" type="text" placeholder="예: 박력분 200g" value="${v}" style="flex:1;min-width:0"><div class="ibt del" style="flex-shrink:0;margin-top:1px" onclick="this.parentNode.remove()">${ico('ic-trash')}</div>`;d.appendChild(row);}
function addStep(t='',m=''){const d=document.getElementById('stepInputs');const idx=d.children.length+1;const row=document.createElement('div');row.className='dynrow';row.innerHTML=`<span class="stepnum">${idx}</span><div class="dyninner"><input class="finput" type="text" placeholder="단계 설명" value="${t}"><textarea class="memoinput" placeholder="이 단계 메모 (선택)">${m}</textarea></div><div class="ibt del" style="margin-top:5px;flex-shrink:0" onclick="this.parentNode.remove();reIdx()">${ico('ic-trash')}</div>`;d.appendChild(row);}
function reIdx(){document.querySelectorAll('#stepInputs .stepnum').forEach((s,i)=>s.textContent=i+1);}
function openIM(){editIId=null;document.getElementById('imTitle').textContent='재료 추가';['iName','iQty'].forEach(id=>document.getElementById(id).value='');document.getElementById('iLow').checked=false;document.getElementById('imModal').classList.add('open');}
function editI(id){const i=D[curSec].pantry.find(x=>x.id===id);editIId=id;document.getElementById('imTitle').textContent='재료 수정';document.getElementById('iName').value=i.name;document.getElementById('iQty').value=i.qty;document.getElementById('iCat').value=i.cat;document.getElementById('iLow').checked=i.low;document.getElementById('imModal').classList.add('open');}
function saveI(){const name=document.getElementById('iName').value.trim();if(!name)return;const d={name,qty:document.getElementById('iQty').value.trim(),cat:document.getElementById('iCat').value,low:document.getElementById('iLow').checked};if(editIId){const i=D[curSec].pantry.findIndex(x=>x.id===editIId);D[curSec].pantry[i]={...D[curSec].pantry[i],...d};}else D[curSec].pantry.unshift({id:Date.now(),...d});cm('imModal');rI();}
function delI(id){if(confirm('삭제할까요?')){D[curSec].pantry=D[curSec].pantry.filter(i=>i.id!==id);rI();}}
function cm(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.ovl').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));
</script>
</body>
</html>
